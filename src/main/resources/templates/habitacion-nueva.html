<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${id == null ? 'Nueva habitación | Hotel IBATTI' : 'Editar habitación | Hotel IBATTI'}">
        Habitaciones | Hotel IBATTI
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@500;600&amp;display=swap">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/gestion.css}">
</head>
<body class="hotel-gestion">
    <nav class="navbar hotel-barra" data-bs-theme="dark" aria-label="Principal">
        <div class="container py-1">
            <a class="navbar-brand" th:href="@{/}">Hotel IBATTI</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/habitaciones}">
                Volver a habitaciones
            </a>
        </div>
    </nav>

    <main class="container py-4 py-md-5">
        <div class="row">
            <div class="col-12 col-lg-8 col-xl-7">
                <h1 class="hotel-titulo mb-4"
                    th:text="${id == null ? 'Nueva habitación' : 'Editar habitación'}">
                    Nueva habitación
                </h1>

                <div class="alert alert-danger" role="alert"
                     th:if="${error != null}" th:text="${error}"></div>
                <div class="alert alert-warning" role="status"
                     th:if="${id == null and hoteles.isEmpty()}">
                    Primero tiene que haber un hotel registrado.
                </div>

                <form class="hotel-panel p-3 p-sm-4" method="post"
                      th:if="${id != null or !hoteles.isEmpty()}"
                      th:action="${id == null} ? @{/habitaciones} : @{/habitaciones/{id}/editar(id=${id})}">
                    <div class="mb-3" th:if="${id == null}">
                        <label class="form-label" for="hotelId">Hotel</label>
                        <select class="form-select" id="hotelId" name="hotelId" required>
                            <option value="">Elegí un hotel</option>
                            <option th:each="opcion : ${hoteles}"
                                    th:value="${opcion.id()}"
                                    th:text="${opcion.nombre()}"
                                    th:selected="${hotelId == ('' + opcion.id())}"></option>
                        </select>
                    </div>

                    <div class="mb-3" th:if="${id != null}">
                        <div class="text-body-secondary">Hotel</div>
                        <strong th:text="${hotel}"></strong>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label" for="numero">Número</label>
                            <input class="form-control" id="numero" name="numero"
                                   type="number" min="1" th:value="${numero}" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label" for="tipo">Tipo</label>
                            <select class="form-select" id="tipo" name="tipo" required>
                                <option value="">Elegí un tipo</option>
                                <option th:each="opcion : ${tipos}"
                                        th:value="${opcion.name()}"
                                        th:text="${opcion.name()}"
                                        th:selected="${tipo == opcion.name()}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-12 col-sm-6">
                            <label class="form-label" for="capacidad">Capacidad</label>
                            <input class="form-control" id="capacidad" name="capacidad"
                                   type="number" min="1" th:value="${capacidad}" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label" for="precio">Precio por noche ($)</label>
                            <input class="form-control" id="precio" name="precio"
                                   type="number" min="0.01" max="9999999999.99"
                                   step="0.01" th:value="${precio}" required>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-primary" type="submit"
                                th:text="${id == null ? 'Guardar habitación' : 'Guardar cambios'}">
                            Guardar habitación
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/habitaciones}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
